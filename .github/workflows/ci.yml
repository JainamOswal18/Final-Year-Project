name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: locallens } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install (prebuilt CPU wheel for llama-cpp-python)
        run: |
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -e ".[dev]"
      - name: Tests (the model-dependent ones skip themselves when the model file is absent)
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: locallens/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: locallens/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
