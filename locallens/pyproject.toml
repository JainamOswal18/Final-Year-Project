[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locallens"
version = "0.2.0"
description = "Privacy-preserving, offline natural-language to visualization with a small local language model"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1", "pandas>=2.2", "pyarrow>=17", "openpyxl>=3.1", "pydantic>=2.8", "sqlglot>=25",
  "rapidfuzz>=3.9", "dateparser>=1.2", "pyyaml>=6", "llama-cpp-python>=0.3", "huggingface_hub>=0.25",
  "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4", "requests>=2.31"]

[project.scripts]
locallens = "locallens.server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"locallens.viz" = ["charts_rules.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
